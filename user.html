<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alzaro Apps</title>
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --primary-light: #fef2f2;
            --surface: #fafafa;
            --card-bg: #ffffff;
            --text-primary: #18181b;
            --text-secondary: #71717a;
            --accent: #dc2626;
            --star-rating: #fbbf24;
            --success: #16a34a;
            --shadow-1: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px 0 rgba(0,0,0,0.06);
            --shadow-2: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --shadow-3: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--surface);
            color: var(--text-primary);
            line-height: 1.6;
            padding-bottom: 80px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* App Bar */
        .app-bar {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-2);
        }

        .app-bar-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
        }

        .app-bar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-bar-logo {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .app-bar-title {
            font-size: 20px;
            font-weight: 800;
        }

        .app-bar-subtitle {
            font-size: 12px;
            opacity: 0.9;
        }

        .support-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .support-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        .support-btn .material-icons {
            font-size: 22px;
        }

        /* Search */
        .search-container {
            padding: 16px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid #e4e4e7;
            position: sticky;
            top: 73px;
            z-index: 90;
        }

        .search-box {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border: 2px solid #e4e4e7;
            border-radius: 50px;
            font-size: 15px;
            background: var(--surface);
            transition: all 0.3s;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(220,38,38,0.1);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .search-clear {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--text-secondary);
            color: white;
            border: none;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }

        .search-clear.show {
            display: flex;
        }

        /* Categories */
        .categories {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            background: var(--card-bg);
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            background: var(--surface);
            color: var(--text-secondary);
        }

        .category-chip:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .category-chip.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(220,38,38,0.3);
        }

        /* Main Content */
        .main-content {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title a {
            font-size: 14px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        /* App Grid */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 640px) {
            .app-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .app-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .app-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-1);
            border: 1px solid #e4e4e7;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-2);
            border-color: var(--primary-light);
        }

        .app-icon {
            width: 72px;
            height: 72px;
            border-radius: var(--radius-md);
            object-fit: cover;
            margin-bottom: 12px;
            box-shadow: var(--shadow-1);
        }

        .app-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 8px;
        }

        .app-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .app-rating .star {
            color: var(--star-rating);
        }

        .install-btn {
            padding: 8px 20px;
            border-radius: 6px;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .install-btn:hover {
            background: var(--primary);
            color: white;
        }

        /* Bottom Sheet */
        .bottom-sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .bottom-sheet-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .bottom-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--card-bg);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 201;
        }

        .bottom-sheet.active {
            transform: translateY(0);
        }

        .bottom-sheet-handle {
            width: 40px;
            height: 4px;
            background: #d4d4d8;
            border-radius: 2px;
            margin: 12px auto;
        }

        .bottom-sheet-content {
            padding: 0 24px 100px;
        }

        /* App Hero */
        .app-hero {
            display: flex;
            gap: 20px;
            padding: 24px 0;
            align-items: center;
        }

        .hero-icon {
            width: 100px;
            height: 100px;
            border-radius: var(--radius-lg);
            object-fit: cover;
            box-shadow: var(--shadow-2);
        }

        .hero-info {
            flex: 1;
        }

        .hero-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .hero-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .hero-rating {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
        }

        .hero-rating .star {
            color: var(--star-rating);
        }

        .hero-stats {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Screenshots */
        .screenshots-section {
            margin: 24px 0;
        }

        .section-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .screenshots-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 4px;
            margin: 0 -4px;
        }

        .screenshots-scroll::-webkit-scrollbar {
            display: none;
        }

        .screenshot-item {
            flex: 0 0 auto;
            width: 200px;
            height: 355px;
            border-radius: var(--radius-md);
            overflow: hidden;
            scroll-snap-align: start;
            background: var(--surface);
            box-shadow: var(--shadow-1);
        }

        .screenshot-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Description */
        .description-section {
            margin: 24px 0;
        }

        .description-text {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: all 0.3s;
        }

        .description-text.expanded {
            -webkit-line-clamp: unset;
        }

        .read-more {
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            margin-top: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* Permissions */
        .permissions-section {
            margin: 24px 0;
        }

        .permissions-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .permission-chip {
            padding: 8px 14px;
            background: var(--surface);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .permission-chip .material-icons {
            font-size: 16px;
            color: var(--success);
        }

        /* Rating Section */
        .rating-section {
            margin: 24px 0;
            padding: 24px;
            background: var(--surface);
            border-radius: var(--radius-lg);
        }

        .rating-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .rating-big {
            font-size: 56px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1;
        }

        .rating-info {
            flex: 1;
        }

        .rating-stars {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }

        .rating-stars .material-icons {
            color: var(--star-rating);
            font-size: 24px;
        }

        .rating-count {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .rating-bars {
            margin-top: 16px;
        }

        .rating-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .rating-bar-label {
            font-size: 13px;
            color: var(--text-secondary);
            width: 24px;
        }

        .rating-bar-track {
            flex: 1;
            height: 6px;
            background: #e4e4e7;
            border-radius: 3px;
            overflow: hidden;
        }

        .rating-bar-fill {
            height: 100%;
            background: var(--star-rating);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        /* User Rating */
        .user-rating {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 2px solid #e4e4e7;
        }

        .user-rating-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .star-input {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .star-input .material-icons {
            font-size: 36px;
            color: #e4e4e7;
            cursor: pointer;
            transition: all 0.2s;
        }

        .star-input .material-icons.active {
            color: var(--star-rating);
        }

        .review-input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e4e4e7;
            border-radius: var(--radius-md);
            font-size: 15px;
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
            margin-bottom: 12px;
        }

        .review-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .submit-review {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-review:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220,38,38,0.3);
        }

        .submit-review:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Reviews List */
        .reviews-section {
            margin: 24px 0;
        }

        .review-item {
            padding: 16px 0;
            border-bottom: 1px solid #e4e4e7;
        }

        .review-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .review-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
        }

        .review-meta {
            flex: 1;
        }

        .review-name {
            font-size: 15px;
            font-weight: 700;
        }

        .review-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .review-stars {
            color: var(--star-rating);
            font-size: 14px;
        }

        .review-text {
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.6;
            margin-left: 52px;
        }

        /* Fixed Install Bar */
        .install-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            padding: 16px 24px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            display: flex;
            gap: 16px;
            align-items: center;
            z-index: 150;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .install-bar.visible {
            transform: translateY(0);
        }

        .install-bar-info {
            flex: 1;
        }

        .install-bar-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .install-bar-size {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .install-bar-btn {
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 14px rgba(220,38,38,0.3);
        }

        .install-bar-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220,38,38,0.4);
        }

        /* UPI Dialog */
        .dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .dialog-overlay.active {
            display: flex;
            opacity: 1;
        }

        .dialog {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 400px;
            padding: 32px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s;
            box-shadow: var(--shadow-3);
        }

        .dialog-overlay.active .dialog {
            transform: scale(1);
        }

        .dialog-icon {
            width: 80px;
            height: 80px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--primary);
        }

        .dialog-icon .material-icons {
            font-size: 40px;
        }

        .dialog-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .dialog-text {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 15px;
        }

        .dialog-input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e4e4e7;
            border-radius: var(--radius-md);
            font-size: 16px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        .dialog-input:focus {
            border-color: var(--primary);
        }

        .dialog-actions {
            display: flex;
            gap: 12px;
        }

        .dialog-btn {
            flex: 1;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }

        .dialog-btn-secondary {
            background: var(--surface);
            color: var(--text-primary);
        }

        .dialog-btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 14px rgba(220,38,38,0.3);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #18181b;
            color: white;
            padding: 16px 24px;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-3);
            z-index: 400;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast-icon {
            color: var(--success);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--primary-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--primary);
        }

        .empty-icon .material-icons {
            font-size: 40px;
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <!-- App Bar -->
    <header class="app-bar">
        <div class="app-bar-content">
            <div class="app-bar-brand">
                <img src="" alt="Logo" class="app-bar-logo" id="storeLogo" style="display: none;">
                <div>
                    <div class="app-bar-title" id="storeName">Alzaro Apps</div>
                    <div class="app-bar-subtitle">Discover Amazing Apps</div>
                </div>
            </div>
            <button class="support-btn" id="supportBtn" onclick="openUpiDialog()" style="display: none;" title="Support Developer">
                <span class="material-icons">favorite</span>
            </button>
        </div>
    </header>

    <!-- Search -->
    <div class="search-container">
        <div class="search-box">
            <span class="material-icons search-icon">search</span>
            <input type="text" class="search-input" id="searchInput" placeholder="Search apps & games..." oninput="handleSearch(this.value)">
            <button class="search-clear" id="searchClear" onclick="clearSearch()">×</button>
        </div>
    </div>

    <!-- Categories -->
    <div class="categories">
        <div class="category-chip active" onclick="filterCategory('all', this)">All</div>
        <div class="category-chip" onclick="filterCategory('app', this)">Apps</div>
        <div class="category-chip" onclick="filterCategory('game', this)">Games</div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="app-grid" id="appGrid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading apps...</p>
            </div>
        </div>
    </main>

    <!-- Bottom Sheet -->
    <div class="bottom-sheet-overlay" id="bottomSheetOverlay" onclick="closeBottomSheet()"></div>
    <div class="bottom-sheet" id="bottomSheet">
        <div class="bottom-sheet-handle"></div>
        <div class="bottom-sheet-content" id="bottomSheetContent">
            <!-- Dynamic content -->
        </div>
    </div>

    <!-- Install Bar -->
    <div class="install-bar" id="installBar">
        <div class="install-bar-info">
            <div class="install-bar-title" id="installBarTitle">App Name</div>
            <div class="install-bar-size" id="installBarSize">Tap to install</div>
        </div>
        <button class="install-bar-btn" onclick="installApp()">
            <span class="material-icons" style="font-size: 18px; vertical-align: middle; margin-right: 4px;">download</span>
            Install
        </button>
    </div>

    <!-- UPI Dialog -->
    <div class="dialog-overlay" id="upiDialog" onclick="closeUpiDialog(event)">
        <div class="dialog">
            <div class="dialog-icon">
                <span class="material-icons">favorite</span>
            </div>
            <h3 class="dialog-title">Support Developer</h3>
            <p class="dialog-text">Your contribution helps us build better apps. Thank you for your support!</p>
            <input type="number" class="dialog-input" id="upiAmount" placeholder="Enter amount (₹)" value="50">
            <div class="dialog-actions">
                <button class="dialog-btn dialog-btn-secondary" onclick="closeUpiDialog()">Cancel</button>
                <button class="dialog-btn dialog-btn-primary" onclick="payViaUpi()">Pay Now</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <span class="material-icons toast-icon">check_circle</span>
        <span id="toastMessage">Success</span>
    </div>

    <script>
        // Firebase Configuration - REPLACE WITH YOURS
        const firebaseConfig = {  apiKey: "AIzaSyDV1kHw2WWZJTvF4jUh6UamN-GYy3ArZww",  authDomain: "alzaro-real.firebaseapp.com",  projectId: "alzaro-real",  storageBucket: "alzaro-real.firebasestorage.app",  messagingSenderId: "625762216177",  appId: "1:625762216177:web:e3156d8da86bf8317d6150"};
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allApps = [];
        let currentApp = null;
        let currentFilter = 'all';
        let upiId = '';
        let userRating = 0;

        // Load Data
        async function loadData() {
            try {
                // Load settings
                const settingsDoc = await db.collection('settings').doc('store').get();
                if (settingsDoc.exists) {
                    const data = settingsDoc.data();
                    if (data.name) {
                        document.getElementById('storeName').textContent = data.name;
                        document.title = data.name;
                    }
                    if (data.logo) {
                        document.getElementById('storeLogo').src = data.logo;
                        document.getElementById('storeLogo').style.display = 'block';
                    }
                }

                // Load UPI
                const upiDoc = await db.collection('settings').doc('upi').get();
                if (upiDoc.exists) {
                    const data = upiDoc.data();
                    upiId = data.id || '';
                    if (data.enabled && upiId) {
                        document.getElementById('supportBtn').style.display = 'flex';
                    }
                }

                // Load apps
                const snapshot = await db.collection('apps').orderBy('createdAt', 'desc').get();
                allApps = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                renderApps(allApps);
            } catch (error) {
                console.error(error);
                showToast('Failed to load apps', 'error');
            }
        }

        // Render Apps
        function renderApps(apps) {
            const grid = document.getElementById('appGrid');
            
            if (apps.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <div class="empty-icon">
                            <span class="material-icons">search_off</span>
                        </div>
                        <p>No apps found</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = apps.map(app => `
                <div class="app-card" onclick="openAppDetail('${app.id}')">
                    <img src="${app.logo}" class="app-icon" onerror="this.src='https://via.placeholder.com/72?text=${app.title[0]}'" loading="lazy">
                    <div class="app-title">${app.title}</div>
                    <div class="app-subtitle">${app.subtitle}</div>
                    <div class="app-meta">
                        <span class="app-rating">
                            <span class="star">★</span>
                            ${app.rating || '0.0'}
                        </span>
                        <button class="install-btn" onclick="event.stopPropagation(); quickInstall('${app.id}')">Install</button>
                    </div>
                </div>
            `).join('');
        }

        // Filter Category
        function filterCategory(category, chip) {
            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentFilter = category;

            filterAndRender();
        }

        // Search
        function handleSearch(value) {
            document.getElementById('searchClear').classList.toggle('show', value.length > 0);
            filterAndRender();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClear').classList.remove('show');
            filterAndRender();
        }

        function filterAndRender() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allApps;
            
            if (currentFilter !== 'all') {
                filtered = filtered.filter(app => app.category === currentFilter);
            }
            
            if (searchTerm) {
                filtered = filtered.filter(app => 
                    app.title.toLowerCase().includes(searchTerm) ||
                    app.subtitle.toLowerCase().includes(searchTerm)
                );
            }
            
            renderApps(filtered);
        }

        // FIXED: Open App Detail with Reviews
        async function openAppDetail(appId) {
            currentApp = allApps.find(a => a.id === appId);
            if (!currentApp) return;

            // FIXED: Load reviews from correct Firestore path
            let reviews = [];
            try {
                const reviewsSnapshot = await db.collection('reviews').doc(appId).collection('list').orderBy('date', 'desc').get();
                reviews = reviewsSnapshot.docs.map(doc => doc.data());
            } catch (error) {
                console.log('No reviews yet:', error);
                reviews = [];
            }

            const content = document.getElementById('bottomSheetContent');
            content.innerHTML = `
                <div class="app-hero">
                    <img src="${currentApp.logo}" class="hero-icon" onerror="this.src='https://via.placeholder.com/100?text=${currentApp.title[0]}'">
                    <div class="hero-info">
                        <div class="hero-title">${currentApp.title}</div>
                        <div class="hero-subtitle">${currentApp.subtitle}</div>
                        <div class="hero-rating">
                            <span class="star">★</span>
                            <span style="font-weight: 700;">${currentApp.rating || '0.0'}</span>
                            <span style="color: var(--text-secondary);">• ${currentApp.reviewCount || 0} reviews</span>
                        </div>
                        <div class="hero-stats">
                            <span>${currentApp.downloads || 0} downloads</span>
                            <span>•</span>
                            <span>${currentApp.size || 'Unknown size'}</span>
                        </div>
                    </div>
                </div>

                ${currentApp.screenshots && currentApp.screenshots.length > 0 ? `
                <div class="screenshots-section">
                    <div class="section-label">Screenshots</div>
                    <div class="screenshots-scroll">
                        ${currentApp.screenshots.map(url => `
                            <div class="screenshot-item">
                                <img src="${url}" onerror="this.style.display='none'" loading="lazy">
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}

                <div class="description-section">
                    <div class="section-label">About this app</div>
                    <div class="description-text" id="descText">${currentApp.description || 'No description available.'}</div>
                    ${(currentApp.description || '').length > 150 ? `
                    <div class="read-more" onclick="toggleDescription()">
                        Read more <span class="material-icons" style="font-size: 16px;">expand_more</span>
                    </div>
                    ` : ''}
                </div>

                ${currentApp.permissions && currentApp.permissions.length > 0 ? `
                <div class="permissions-section">
                    <div class="section-label">Permissions</div>
                    <div class="permissions-list">
                        ${currentApp.permissions.map(perm => `
                            <div class="permission-chip">
                                <span class="material-icons">check_circle</span>
                                ${perm}
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}

                <div class="rating-section">
                    <div class="rating-header">
                        <div class="rating-big">${currentApp.rating || '0.0'}</div>
                        <div class="rating-info">
                            <div class="rating-stars">
                                ${[1,2,3,4,5].map(i => `
                                    <span class="material-icons">${i <= Math.round(currentApp.rating || 0) ? 'star' : 'star_border'}</span>
                                `).join('')}
                            </div>
                            <div class="rating-count">${currentApp.reviewCount || 0} reviews</div>
                        </div>
                    </div>
                    
                    <div class="rating-bars">
                        ${[5,4,3,2,1].map(star => {
                            const count = reviews.filter(r => r.rating === star).length;
                            const percent = reviews.length ? (count / reviews.length * 100) : 0;
                            return `
                                <div class="rating-bar">
                                    <span class="rating-bar-label">${star}</span>
                                    <div class="rating-bar-track">
                                        <div class="rating-bar-fill" style="width: ${percent}%"></div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="user-rating">
                        <div class="user-rating-title">Rate this app</div>
                        <div class="star-input" id="starInput">
                            ${[1,2,3,4,5].map(i => `
                                <span class="material-icons" onclick="setRating(${i})">star_border</span>
                            `).join('')}
                        </div>
                        <textarea class="review-input" id="reviewText" placeholder="Share your experience..."></textarea>
                        <button class="submit-review" onclick="submitReview()">Submit Review</button>
                    </div>
                </div>

                ${reviews.length > 0 ? `
                <div class="reviews-section">
                    <div class="section-label">Reviews (${reviews.length})</div>
                    ${reviews.slice(0, 10).map(review => `
                        <div class="review-item">
                            <div class="review-header">
                                <div class="review-avatar">${(review.userName || 'U')[0].toUpperCase()}</div>
                                <div class="review-meta">
                                    <div class="review-name">${review.userName || 'Anonymous'}</div>
                                    <div class="review-date">${review.date ? new Date(review.date).toLocaleDateString() : 'Recently'}</div>
                                </div>
                                <div class="review-stars">${'★'.repeat(review.rating || 0)}</div>
                            </div>
                            ${review.text ? `<div class="review-text">${review.text}</div>` : ''}
                        </div>
                    `).join('')}
                </div>
                ` : '<div class="reviews-section"><div class="section-label">Reviews</div><p style="color: var(--text-secondary); padding: 16px 0;">No reviews yet. Be the first to review!</p></div>'}
            `;

            // Update install bar
            document.getElementById('installBarTitle').textContent = currentApp.title;
            document.getElementById('installBarSize').textContent = currentApp.size || 'Tap to install';
            document.getElementById('installBar').classList.add('visible');

            // Open bottom sheet
            document.getElementById('bottomSheetOverlay').classList.add('active');
            document.getElementById('bottomSheet').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeBottomSheet() {
            document.getElementById('bottomSheetOverlay').classList.remove('active');
            document.getElementById('bottomSheet').classList.remove('active');
            document.getElementById('installBar').classList.remove('visible');
            document.body.style.overflow = '';
            currentApp = null;
            userRating = 0;
        }

        // FIXED: Toggle description
        function toggleDescription() {
            const desc = document.getElementById('descText');
            const btn = event.currentTarget;
            const isExpanded = desc.classList.contains('expanded');
            
            if (isExpanded) {
                desc.classList.remove('expanded');
                btn.innerHTML = 'Read more <span class="material-icons" style="font-size: 16px;">expand_more</span>';
            } else {
                desc.classList.add('expanded');
                btn.innerHTML = 'Read less <span class="material-icons" style="font-size: 16px;">expand_less</span>';
            }
        }

        // FIXED: Set rating
        function setRating(rating) {
            userRating = rating;
            const stars = document.getElementById('starInput').querySelectorAll('.material-icons');
            stars.forEach((star, index) => {
                star.textContent = index < rating ? 'star' : 'star_border';
                star.classList.toggle('active', index < rating);
            });
        }

        // FIXED: Submit review
        async function submitReview() {
            if (!currentApp) {
                showToast('Error: No app selected', 'error');
                return;
            }
            
            if (userRating === 0) {
                showToast('Please select a rating');
                return;
            }

            const text = document.getElementById('reviewText').value.trim();
            
            // Show loading
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = 'Submitting...';
            btn.disabled = true;

            try {
                const review = {
                    rating: userRating,
                    text: text,
                    userName: 'Anonymous',
                    date: Date.now()
                };

                // FIXED: Save to correct Firestore path
                await db.collection('reviews').doc(currentApp.id).collection('list').add(review);

                // FIXED: Update app rating correctly
                const reviewsSnapshot = await db.collection('reviews').doc(currentApp.id).collection('list').get();
                const allReviews = reviewsSnapshot.docs.map(d => d.data());
                
                const totalRating = allReviews.reduce((sum, r) => sum + (r.rating || 0), 0);
                const avgRating = allReviews.length ? (totalRating / allReviews.length) : 0;

                await db.collection('apps').doc(currentApp.id).update({
                    rating: Math.round(avgRating * 10) / 10,
                    reviewCount: allReviews.length
                });

                showToast('Review submitted successfully!');
                
                // Refresh the app data
                const appDoc = await db.collection('apps').doc(currentApp.id).get();
                const updatedApp = { id: appDoc.id, ...appDoc.data() };
                
                // Update local array
                const index = allApps.findIndex(a => a.id === currentApp.id);
                if (index !== -1) {
                    allApps[index] = updatedApp;
                    currentApp = updatedApp;
                }
                
                // Reopen to show updated reviews
                setTimeout(() => openAppDetail(currentApp.id), 500);
                
            } catch (error) {
                console.error('Review error:', error);
                showToast('Failed to submit review: ' + error.message, 'error');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // Install
        function quickInstall(appId) {
            const app = allApps.find(a => a.id === appId);
            if (!app || !app.downloadUrl) {
                showToast('Download link not available', 'error');
                return;
            }
            downloadFile(app.downloadUrl, app.title);
        }

        function installApp() {
            if (!currentApp || !currentApp.downloadUrl) {
                showToast('Download link not available', 'error');
                return;
            }
            downloadFile(currentApp.downloadUrl, currentApp.title);
            
            // Increment download count
            db.collection('apps').doc(currentApp.id).update({
                downloads: firebase.firestore.FieldValue.increment(1)
            });
        }

        function downloadFile(url, filename) {
            // Force download with proper filename
            const link = document.createElement('a');
            link.href = url;
            link.download = filename.replace(/\s+/g, '_') + '.apk';
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast(`Downloading ${filename}...`);
        }

        // UPI
        function openUpiDialog() {
            if (!upiId) {
                showToast('UPI not configured');
                return;
            }
            document.getElementById('upiDialog').classList.add('active');
        }

        function closeUpiDialog(e) {
            if (e && e.target !== e.currentTarget && !e.target.closest('.dialog-btn')) return;
            document.getElementById('upiDialog').classList.remove('active');
        }

        function payViaUpi() {
            const amount = document.getElementById('upiAmount').value;
            if (!amount || amount < 1) {
                showToast('Please enter valid amount');
                return;
            }

            const upiUrl = `upi://pay?pa=${upiId}&pn=AlzaroApps&am=${amount}&cu=INR`;
            
            // Try to open UPI app
            window.location.href = upiUrl;
            
            // Fallback for desktop
            setTimeout(() => {
                showToast('Please open UPI app manually if not opened');
            }, 500);
            
            closeUpiDialog();
        }

        // Utilities
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.querySelector('.toast-icon').textContent = type === 'error' ? 'error' : 'check_circle';
            toast.querySelector('.toast-icon').style.color = type === 'error' ? 'var(--primary)' : 'var(--success)';
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
